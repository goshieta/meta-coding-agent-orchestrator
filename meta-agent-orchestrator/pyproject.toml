[project]
name = "meta-agent-orchestrator"
version = "0.1.0"
description = "仕様書をワンライナーで渡すだけで、CrewAI製マネジメント層が pi のセッション・コンテクスト・品質を自律管理し、最終成果物をGitHubへ納品する開発オーケストレーション中間層"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai>=0.86.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
